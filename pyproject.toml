[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom1"
version = "0.1.0"
description = "Shared state for AI agents that only believes what it has checked."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["mcp>=1.12"]

[tool.setuptools]
packages = ["axiom1", "axiom1.engines"]
